name: CI
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, Europe/London, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
      - if: matrix.tz == 'UTC'
        run: npx playwright install --with-deps chromium
      - if: matrix.tz == 'UTC'
        run: npm run a11y && node scripts/clip-audit.mjs
