name: CI
on:
  push:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Europe/London, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.tz == 'UTC'
        run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.tz == 'UTC' && 'verify' || 'test' }}
        env:
          TZ: ${{ matrix.tz }}
  # The chaos harness takes about half an hour, so it runs weekly and on demand, not on every push.
  chaos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run chaos -- --out chaos-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: chaos-report.json
