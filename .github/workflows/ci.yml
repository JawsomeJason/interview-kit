name: CI
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Europe/London, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.tz == 'UTC'
        run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.tz == 'UTC' && 'verify' || 'test' }}
        env:
          TZ: ${{ matrix.tz }}
