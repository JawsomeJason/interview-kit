name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # One job: bundle.test.js already checks UTC, London and Los Angeles itself; the job's own zone stays non-UTC.
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - run: npm run verify
        env:
          TZ: America/Los_Angeles
  # The chaos harness takes about half an hour, so it runs only from the Run workflow button.
  chaos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run chaos -- --out chaos-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: chaos-report.json
