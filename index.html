<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview kit</title>
  <script>
    // Apply a saved Light or Dark scheme before first paint, so the page never flashes.
    try {
      const root = document.documentElement;
      const prefs = JSON.parse(localStorage.getItem('interview-kit-layout')) ?? {};
      if (prefs.scheme === 'light' || prefs.scheme === 'dark') root.style.colorScheme = prefs.scheme;
    } catch {}
  </script>
</head>
<body>
  <div id="root" class="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
